name: Deploy MyFin (Private Tailscale CI/CD)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Actualizar Repositorio y Reconstruir Docker
        run: |
          cd ~/stacks/MyFin
          git pull origin main
          docker compose down
          docker compose build --no-cache
          docker compose up -d