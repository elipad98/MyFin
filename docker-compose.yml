version: '3.8'

services:
  myfin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myfin-app
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - DATABASE_URL=file:/data/dev.db
      - JWT_SECRET=myfin-debian-homelab-super-secret-key-2026
    volumes:
      - myfin-data:/data

volumes:
  myfin-data:
